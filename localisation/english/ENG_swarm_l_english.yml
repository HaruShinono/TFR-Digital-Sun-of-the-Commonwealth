 ENG_tfr_royal_charles_harmony:0 "The Prince's Sustainability Initiative"
 ENG_tfr_royal_charles_harmony_desc:0 "Royal trusts support sustainable urban planning, domestic agriculture, and community resilience."
 ENG_tfr_royal_anne_logistics:0 "Royal Logistics Patronage"
