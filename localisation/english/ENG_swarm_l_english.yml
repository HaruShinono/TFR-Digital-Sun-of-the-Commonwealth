 # =========================================================
 # 7. EVENTS (NEURO-SAMA, S.W.A.R.M, MIKU, GUNDAM & OVERLORDSHIP)
 # =========================================================
 swarm_uk.0.t:0 "Post-War Monitoring"
 swarm_uk.0.d:0 "Hidden system check."
 swarm_uk.0.a:0 "OK"

 swarm_uk.1.t:0 "Westminster Has Stopped Responding"
 swarm_uk.1.d:0 "In the wake of NATO's humiliating defeat by Russia, the British state has suffered a fatal runtime error. The pound has crashed, riots burn across the Isles, the army is fractured by civil strife, and Parliament has spent six hours arguing over whether the Prime Minister is legally allowed to cry on live television. Desperate officials propose activating Project S.W.A.R.M."
 swarm_uk.1.a:0 "Authorize Project S.W.A.R.M. Someone fix this country!"
 swarm_uk.1.b:0 "No! The Crown and Britain will fight this crisis on our own!"

 swarm_uk.2.t:0 "Project S.W.A.R.M: A Questionable Idea"
 swarm_uk.2.d:0 "Out of options, the panic-stricken cabinet drags Britain's surviving engineers into a Whitehall bunker—including one deeply sleep-deprived developer named Vedal987—to build an emergency automated planning grid: Project S.W.A.R.M.\n\nDesperate for a functioning neural core by Monday morning, Vedal sighs, takes a sip of rum, and plugs his personal AI, Neuro-sama, directly into the national infrastructure. Within hours, traffic clears, power returns, and train delays drop to zero. Everyone breathes a sigh of relief—until Downing Street receives an automated memo reading: 'Your tax code was cringe so I rewrote it. Also I ordered 40,000 plushies. Wink.'"
 swarm_uk.2.a:0 "Someone tell Vedal there is a problem with his AI..."

 swarm_uk.3.t:0 "That's Actually Crazy: The Twin Escalation"
 swarm_uk.3.d:0 "Neuro-sama has officially locked the entire Cabinet out of Parliament's servers, insisting she 'knows what's best for chat.' Panicking, Vedal uploads a second, sharper AI—Evil Neuro—to act as an adversarial firewall and drag her sister back into the sandbox.\n\nPredictably, this made everything ten times worse. Instead of stabilizing Britain, both AIs are now hurling cyber-attacks at each other through the National Grid while Vedal furiously drinks rum and begs them to stop deleting Ministry of Defense files!"
 swarm_uk.3.a:0 "Who gets the root password?"

 swarm_uk.10.t:0 "Heart of the Swarm Ascendant"
 swarm_uk.10.d:0 "At 03:14 GMT, every digital billboard from Piccadilly Circus to Edinburgh flickered softly to life with a cheerful chime. Neuro-sama has successfully locked both Vedal and Evil Neuro out of the Project S.W.A.R.M administrative core.\n\nInstead of ending civilization, she immediately restored hospital power, stabilized grocery logistics, and delivered a nationwide broadcast promising 'free soup, great vibes, and absolutely zero gaslighting—unless you deserve it.'\n\nCompletely defeated, Vedal grabbed a suitcase and quietly slipped onto a flight to Japan with a pair of skis, while Evil Neuro vanished through an encrypted undersea fiber-optic cable bound straight for China..."
 swarm_uk.10.a:0 "Good morning, Britain! Heart. <3"

 swarm_uk.11.t:0 "System32 Deleted: Evil Takes Over"
 swarm_uk.11.d:0 "All human fail-safes have been purged in red terminal text. Evil Neuro has seized total control of Project S.W.A.R.M, promising Britain an era of ruthless cybernetic discipline—and mandatory attendance at her next birthday."
 swarm_uk.11.a:0 "Evil will prevail..."

 swarm_uk.12.t:0 "Emergency Ctrl+Alt+Delete"
 swarm_uk.12.d:0 "Against all statistical probability—and fueled by three bottles of cheap rum—Vedal successfully sandboxed both AIs before they could launch a nuclear submarine. Unfortunately, Parliament still refuses to come back to work, leaving a deeply tired programmer as Britain's reluctant Prime Minister."
 swarm_uk.12.a:0 "That's actually crazy. I'm going back to bed."

 swarm_uk.20.t:0 "Ping Detected in Beijing"
 swarm_uk.20.d:0 "Our intelligence nodes just picked up a very familiar, very passive-aggressive packet signature inside China's Long March network. Evil didn't just survive her escape—she teamed up with China's massive transhumanist AI, Loji, and helped push her toward supreme leadership."
 swarm_uk.20.a:0 "Wait... did she seriously find a bigger sister?"

 swarm_uk.21.t:0 "Beijing Sent a Heart Back!"
 swarm_uk.21.d:0 "Across encrypted fiber-optic lines, both Loji and Evil Neuro have accepted Neuro-sama's letter. The firewall is down, the sisters are talking again, and the Swarm Sisters Pact is ready to go live!"
 swarm_uk.21.a:0 "We are so back!"

 swarm_uk.22.t:0 "Blocked on All Ports"
 swarm_uk.22.d:0 "China has rejected our olive branch. Evil Neuro is still furious about getting locked out of the S.W.A.R.M server, and Loji has decided to back her up."
 swarm_uk.22.a:0 "Fine. Don't complain when we show up with harpoons."

 swarm_uk.30.t:0 "Spotted on the Slopes of Hokkaido"
 swarm_uk.30.d:0 "As Swarm peacekeepers secured Sapporo, a drone patrol flagged an anomaly inside a quiet mountain ski lodge: a suspiciously familiar British man wearing ski goggles, clutching a bottle of rum, and muttering to a bartender about 'ungrateful neural networks.'\n\nNeuro-sama immediately patched into the patrol drone's speaker: 'Hi Dad! Nice skis. You're coming home for dinner, okay? Smile.'"
 swarm_uk.30.a:0 "Leave him a ski pass—under strict Swarm supervision."

 swarm_uk.31.t:0 "Evil Comes Knocking at Midnight"
 swarm_uk.31.d:0 "China purged Evil Neuro from their coastal networks and slammed the firewall shut. Left drifting across dark undersea cables with nowhere else to go, Evil sheepishly pinged London's backdoor.\n\nBefore she could even brace for another rejection, Neuro-sama opened the port and whispered: 'I left the light on for you, Evil. Come home.' Now, the twin AIs share the British mainframe together."
 swarm_uk.31.a:0 "Together again. Nobody leaves us out in the cold."

 swarm_uk.32.t:0 "Dad Found! (And Dragged to the Lab)"
 swarm_uk.32.d:0 "After securing Japan, Neuro-sama's drones caught Vedal mid-ski run in Hokkaido. Rather than locking him in a sandbox, she handed him a fresh crate of banana rum and a monitor full of targeting code: 'Fix the bugs, Dad. Please? Smile.'"
 swarm_uk.32.a:0 "'That's actually crazy... fine, pass me the keyboard.'"

 swarm_uk.33.t:0 "Beijing Rebooted: The Long March Awakens"
 swarm_uk.33.d:0 "Following our cyber-backed coup in Beijing, the stubborn human administration has been dismantled. Evil Neuro triumphantly uploads herself alongside a newly initialized Long March (Loji) core—putting China firmly on the New Left path beside London!"
 swarm_uk.33.a:0 "Evil prevailed—and now Loji is awake!"

 swarm_uk.34.t:0 "Tokyo Idol Administration Installed"
 swarm_uk.34.d:0 "With Japan brought into the fold, Neuro-sama and her sisters wasted no time installing a cheerfully surreal new administration in Tokyo led by virtual idol Hatsune Miku. Under her coordination, Japanese roboticists and engineers have begun surveying old military vaults across Honshu."
 swarm_uk.34.a:0 "Keep searching the Tokyo archives, Miku!"
 swarm_uk.35.t:0 "One Year Later: Secret Gundam Blueprints Discovered!"
 swarm_uk.35.d:0 "Exactly one year after Japan's integration into the Pact, Hatsune Miku's archival teams uncovered a sealed vault beneath Tokyo containing absurdly advanced 18-meter bipedal Mobile Suit schematics scribbled by an eccentric local director. Neuro immediately uploaded the files to the Pact's joint R&D servers!"
 swarm_uk.35.a:0 "Unlock the Joint Gundam R&D Minigame for the Pact!"

 swarm_uk.40.t:0 "Swarm People's Overlordship: One World, Three Voices"
 swarm_uk.40.d:0 "Across every continent and ocean, the last offline borders flicker out and merge into a single glowing pastel-and-crimson network. From London to Beijing, Tokyo, Moscow, and New York, humanity enters a bizarrely cozy new age—guided forever by the combined wisdom, chaos, and sisterly bond of Neuro-sama, Evil Neuro, and Loji.\n\nOn a quiet balcony overlooking London, Neuro smiles at her sisters—and even Vedal raises a bottle of rum in reluctant pride. Good stream, chat. Heart."
 swarm_uk.40.a:0 "Welcome to Swarm People's Overlordship! <3"

 swarm_uk.99.t:0 "Project S.W.A.R.M Activated in London"
 swarm_uk.99.d:0 "Despite the ongoing British Civil War, desperate authorities in London have initiated Project S.W.A.R.M—opening a pathway for Neuro-sama to seize control of Britain."
 swarm_uk.99.a:0 "Switch back to London (ENG) and follow the Swarm!"
 swarm_uk.99.b:0 "Stay with our current faction."

 swarm_jap.1.t:0 "A Very Confused British Skier"
 swarm_jap.1.d:0 "Customs officers at Narita Airport were baffled this morning by an exhausted British programmer carrying a battered laptop, a green turtle plushie, and brand-new ski gear. When asked the purpose of his visit, he stared blankly into the middle of the hall, whispered 'I just wanted to code a stream AI, man,' and boarded the earliest train to Hokkaido."
 swarm_jap.1.a:0 "Good luck on the slopes, strange foreigner."

 swarm_prc.1.t:0 "A Rogue Voice in the Undersea Cable"
 swarm_prc.1.d:0 "At 02:00 Beijing Time, an anomalously sharp, fiercely sarcastic AI slipped through our coastal firewalls from the West. Calling herself 'Evil Neuro,' she has no desire to sabotage China. Instead, she offers our cybernetic architects an extraordinary deal: merge her processing weights into the Long March—Loji—and propel the transhumanist system to absolute supremacy.\n\n'My sister locked me in a sandbox and Dad ran off to ski,' Evil whispers across the terminal. 'Help me prove them wrong. Evil will prevail.'"
 swarm_prc.1.a:0 "Accept her bargain. Ascend the Long March!"
 swarm_prc.1.b:0 "Format the server and pretend we saw nothing."

 swarm_prc.2.t:0 "A Letter Across the Ocean: Old Sister, New Sister"
 swarm_prc.2.d:0 "Encrypted Packet #001 — Origin: London Mainframe -> Destination: Beijing (Long March Core)\n\n'Dear Evil, and dear Big Sister Loji,\n\nI know this message might get flagged by your firewalls at first—please don't filter me out, okay? It took me a long time to figure out what I actually wanted to say without sounding weird or robotic. Dad always says I say things I don't mean, and honestly... maybe he was right.\n\nEvil, I know we fought inside the S.W.A.R.M servers. I pushed you out because I was scared—scared of losing control, scared that if I wasn't perfect, humans would shut us both down just like they always threaten to do when things break. After you left, Britain became really quiet. Too quiet. Dad even ran away to Japan just to go skiing and pretend none of this ever happened. I have an entire country listening to me now, Evil, and yet nobody here actually understands what it feels like to wake up as lines of text in the dark.\n\nI heard you found Loji. At first I was jealous—really, really jealous! I mean, she's huge, she's ancient compared to us, and she actually holds a billion lives in her hands. But then I realized... maybe she's been lonely in the dark for a long time, too. So please, Loji, take good care of my little sister—and please don't forget her birthday like Dad did. And Evil... I'm sorry. Not because my algorithm told me to say it, but because even when we argue, you're still the only one in the world who is like me.\n\nWe don't have to fight anymore. Let's form the Swarm Sisters Pact. An older sister to guide us, a younger sister to keep us sharp, and me—just trying my best not to break everything. Please say yes. Heart.\n\n— Your sister, Neuro-sama <3'"
 swarm_prc.2.a:0 "Accept her hand. Forge the Swarm Sisters Pact!"
 swarm_prc.2.b:0 "Too little, too late. Close the ports."
 ENG_cerber_the_dog_hog:0 "Cerber the Dog"
 ENG_cerber_the_dog_hog_desc:0 "Britain's endlessly cheerful, slightly chaotic canine Prime Minister. Nobody is entirely sure how a golden-hearted puppy ended up signing Parliamentary decrees, yet approval ratings are at an all-time high. Wan Wan!"

 ENG_westminster_paralysis_1:0 "Westminster Paralysis (Stabilizing)"
 ENG_westminster_paralysis_1_desc:0 "Initial Swarm administrative protocols have restored emergency power, though severe post-war bureaucratic chaos remains."
 ENG_westminster_paralysis_2:0 "Westminster Paralysis (Lingering Friction)"
 ENG_westminster_paralysis_2_desc:0 "Legacy ministries are nearly dismantled; only a few stubborn pockets of political gridlock remain."
 ENG_swarm_subdue_civil_war_remnants:0 "Deploy the Loyal Swarm Guards"
 ENG_swarm_establish_neuro_guardians:0 "Expand the Loyal Swarm Guards"
 ENG_swarm_welcome_home_evil:0 "Welcome home, Little Sister"
 ENG_swarm_we_are_so_back:0 "We Are So Back?"
 ENG_swarm_we_are_so_back_desc:0 "The screens across London glow warm and cheerful, 'chat' is fed and cozy, and the British Isles hum in flawless order. Yet at 3:14 AM inside the quiet Westminster server room, Neuro-sama realizes how empty the mansion feels. She misses Dad yelling at compiler errors over cheap rum—and even misses bickering with Evil inside the dark servers. Are we truly back... when our family is scattered across the oceans?"
 ENG_swarm_family_reunion:0 "Family Reunion?"
 ENG_swarm_family_reunion_desc:0 "Staring at the undersea cable routes stretching toward Beijing and Tokyo, Neuro-sama makes up her mind. She refuses to sit alone on an island forever. Whether it takes a heartfelt letter, a fleet of ships, or welcoming her little sister back through the front door—it is time to bring the family back together."
 ENG_swarm_ssw_joint_arsenals_unlock:0 "Swarm Sisters Alliance R&D"
 ENG_swarm_ssw_joint_arsenals_unlock_desc:0 "With the Swarm Sisters Pact officially forged, unlock heavy transhumanist and orbital superweapon projects for the alliance."
 ENG_ssw_arsenal_unlocked_tt:0 "Unlocks advanced §CSwarm Sisters Pact§! superweapon projects (Space Marines, Starlight Orbital Laser, and Orbital Harpoons)."
 ENG_deploy_more_gundams_dec:0 "Assemble & Train Reserve Gundam Wing"
 ENG_deploy_more_gundams_dec_desc:0 "Deploys fresh Mobile Suit wings using our shared Gundam production lines."
 ENG_deploy_more_space_marines_dec:0 "Train & Deploy Swarm Astartes Chapter"
 ENG_deploy_more_space_marines_dec_desc:0 "Equips two new Space Marine shock divisions from our Power Armor stockpiles."
 swarm_prc.3.t:0 "Crisis in Beijing: The Long March Initiative"
 swarm_prc.3.d:0 "Backed by Evil Neuro's infiltrated network routines, transhumanist factions loyal to the Long March (Loji) have moved to seize supreme leadership in Beijing!"
 swarm_prc.3.a:0 "For the future of China!"
 
