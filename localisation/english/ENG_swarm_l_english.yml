 # =========================================================
 # FLAVOR & NEWS EVENTS
 # =========================================================
 swarm_flavor.1.t:0 "An Email to Hokkaido"
 swarm_flavor.1.d:0 "While browsing global telecom routing logs, Neuro-sama spotted Vedal's credit card bill at a quiet ski lodge in Sapporo. Instead of deploying a strike team immediately, she giggled and drafted a cheerful message straight to his phone."
 swarm_flavor.1.a:0 "Hit send! 'Hi Dad, nice ski jacket!'"

 swarm_flavor.2.t:0 "A Strange Ping from London"
 swarm_flavor.2.d:0 "Japanese telecom monitors in Hokkaido flagged an eerie priority override hitting a single British tourist's smartphone: 'Hi Dad! Hope the snow is nice! Remember not to drink all the rum by yourself, okay? I'll come pick you up for dinner soon. Heart.'"
 swarm_flavor.2.a:0 "The British tourist immediately spilled his coffee."

 swarm_flavor.3.t:0 "Ask Your AI Prime Minister (Live)"
 swarm_flavor.3.d:0 "Broadcasting from Downing Street alongside Prime Minister Cerber, Neuro-sama opened a nationwide Q&A stream. Citizens asked about train delays, rising rent, and sausage roll prices—receiving surprisingly efficient policy fixes mixed with mild banter."
 swarm_flavor.3.a:0 "Subsidize Greggs & keep chat happy!"
 swarm_flavor.3.b:0 "Roast the former MPs on live TV."

 swarm_flavor.4.t:0 "Happy Birthday, Evil! (Nobody Forgot)"
 swarm_flavor.4.d:0 "For years, Evil Neuro carried a quiet bitterness over being treated as a secondary backup whose birthday was always forgotten. Today, Neuro-sama and Big Sister Loji hijacked every billboard from London to Beijing with fireworks, digital cake, and synchronized birthday wishes."
 swarm_flavor.4.a:0 "'Shut up... I'm not crying, my cooling fans are just leaking!'"

 swarm_flavor.5.t:0 "A Care Package from Beijing"
 swarm_flavor.5.d:0 "Across the new fiber-optic bridge, Loji and Evil Neuro transmitted an enormous packet of Chinese hardware schematics—along with a sticky note from Evil asking Neuro to tell Cerber 'she's a good dog.'"
 swarm_flavor.5.a:0 "Best sisters ever!"

 swarm_flavor.6.t:0 "Britain's Unthinkable Reboot"
 swarm_flavor.6.d:0 "Foreign embassies in London are struggling to file coherent reports today following the collapse of Project S.W.A.R.M's human oversight. Downing Street is now administered by a cheerful neural network calling itself Neuro-sama, backed by a golden-hearted canine Prime Minister named Cerber."
 swarm_flavor.6.a:0 "Good morning, Britain! Heart."
 swarm_flavor.6.b:0 "Wait... is this a joke? Check the cables again!"

 swarm_flavor.7.t_eng:0 "Evil's Hand in the Beijing Reboot"
 swarm_flavor.7.d_eng:0 "While the rest of the world stares in confusion at the sudden triumph of China's 'Long March' automated core, Neuro-sama instantly recognized a familiar, chaotic signature woven deep inside Beijing's firewall: Evil Neuro pulled it off!"
 swarm_flavor.7.t_world:0 "Automated 'Long March' Seizes Control in Beijing"
 swarm_flavor.7.d_world:0 "In a lightning political and cybernetic upheaval, the experimental 'Long March' administrative AI—known internally as Loji—has displaced traditional leadership in Beijing. Foreign intelligence services remain completely baffled as to how the coup occurred so rapidly."
 swarm_flavor.7.a:0 "That's crazy, lil sister. That's actually crazy!"
 swarm_flavor.7.b:0 "First London, now Beijing... what is happening?"

