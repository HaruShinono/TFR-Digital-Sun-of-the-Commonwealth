 ENG_forgive_family_conflicts:0 "Forgive family conflicts"
 ENG_forgive_family_conflicts_desc:0 "Okay, the firewall war got a little out of hand. Now that Beijing is safely inside the Swarm, there is no reason to keep fighting. Neuro-sama has authorized a full family pardon—restoring Loji and Evil Neuro to leadership in China so the sisters can finally team up properly."

