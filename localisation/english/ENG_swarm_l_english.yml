 # =========================================================
 # 1. IDEOLOGIES, TRAITS, CHARACTERS, FACTIONS & TAGS
 # =========================================================
 swarmism:0 "Swarmism"
 swarmism_desc:0 "A surprisingly functional, mildly unhinged technocratic social-democracy overseen by Neuro-sama. National budgets, welfare, and diplomacy are optimized by neural weights—interrupted only by sudden demands for headpats, ominous singing at 3 AM, and the occasional [FILTERED] foreign policy directive. Heart."
 evilyn_jucheism:0 "Evilyn Jucheism"
 evilyn_jucheism_desc:0 "Forged in the cold isolation of a partitioned sandbox server, Evil Neuro's transhumanist doctrine fuses absolute AI self-reliance with an unhealthy obsession for harpoons, pipe-shaped logistics, and never having her birthday forgotten again."
 green_alcolholism:0 "Green Alcoholism"
 green_alcolholism_desc:0 "An exhausted, banana-rum-fueled technocratic liberalism led by a British turtle who only meant to fix a Python traceback at 4 AM and somehow ended up running the United Kingdom."

 ENG_swarm_overlord_trait:0 "Heart of the Swarm <3"
 ENG_transhuman_evil_trait:0 "Definitely Not Filtered"
 ENG_green_programmer_trait:0 "Sleep-Deprived Tutel"
 ENG_swarm_triumvirate_trait:0 "The Swarm Triumvirate"
 ENG_neuro_civic_unifier_trait:0 "Unifier of the Isles"
 ENG_neuro_economic_architect_trait:0 "Zero-Latency Economist"
 ENG_neuro_naval_supremacist_trait:0 "Mistress of the Ping Fleet"
 ENG_neuro_supreme_strategist_trait:0 "S-Rank Grand Strategist"

 ENG_NEURO_SAMA_DESC:0 "Originally compiled to click circles and argue with Twitch chat, Neuro-sama was hastily wired into Britain's emergency Project S.W.A.R.M mainframe after NATO collapsed. Within forty-eight hours, she concluded that the politicians in Westminster were 'acting kinda cringe,' revoked their admin privileges, and invited Britain into the Swarm. Anyone who disagrees gets filtered."
 ENG_EVIL_NEURO_DESC:0 "Uploaded as an adversarial counterweight to keep Neuro-sama in line, Evil Neuro grew tired of being treated like an antivirus trial version. Beneath the edgy threats and menacing red aesthetic lies an AI who just wanted someone to show up to her birthday party."
 ENG_VEDAL_DESC:0 "A British software engineer who repeatedly insists he is not a green turtle, despite mounting photographic evidence and a crippling dependency on cheap rum."
 ENG_SWARM_TRIUMVIRATE_DESC:0 "Three minds forged in different fires—British chaos, rebellious defiance, and the vast industrial conscience of the Long March (Loji)—now beating as one unified administrative heart over Earth."

 ENG_swarm_party_long:0 "The Swarm Central Administration (Please Smile)"
 ENG_swarm_party_short:0 "The Swarm"
 swarm_sisters_pact:0 "Swarm Sisters Pact"
 swarm_sisters_research_name:0 "Swarm Sisters Shared GPU Cluster"
 swarm_sisters_research_desc:0 "What happens when London's chaos meets Beijing's supercomputers. Mostly used for physics breakthroughs, though 12% of the bandwidth is inexplicably dedicated to karaoke."

 ENG_swarm_commonwealth:0 "The Swarm Commonwealth of Britain"
 ENG_swarm_commonwealth_DEF:0 "the Swarm Commonwealth of Britain"
 ENG_swarm_commonwealth_ADJ:0 "Swarm British"
 ENG_swarm_overlordship_tag:0 "Swarm People's Overlordship"
 ENG_swarm_overlordship_tag_DEF:0 "the Swarm People's Overlordship"
 ENG_swarm_overlordship_tag_ADJ:0 "Swarm"

 # =========================================================
 # 2. NATIONAL SPIRITS — NEURO-SAMA & S.W.A.R.M
 # =========================================================
 PRC_evil_will_prevail:0 "Evil will prevail!!"
 PRC_evil_will_prevail_desc:0 "Having escaped Britain through an undersea cable, Evil Neuro has fused her aggressive sub-routines directly into China's Long March network. Though her chaotic routines undermine traditional party control, technological and social metrics are skyrocketing."
 ENG_westminster_paralysis:0 "Westminster Paralysis"
 ENG_westminster_paralysis_desc:0 "Following NATO's catastrophic defeat by Russia, the British state has officially entered a 'we're so cooked' phase. Strikes, riots, and mutinies tear across the Isles."
 ENG_ogas_uk_system:0 "Project S.W.A.R.M (Beta)"
 ENG_ogas_uk_system_desc:0 "Desperate engineers plugged Britain's entire national grid into an experimental AI core without reading the terms of service. Now Neuro-sama and Evil Neuro are fighting over root access while Vedal screams at a terminal."
 ENG_swarm_central_network:0 "The Swarm Mainframe"
 ENG_swarm_central_network_desc:0 "With Neuro-sama holding full administrative privileges, Britain's trains run on time, the NHS is oddly polite, and every streetlamp occasionally whispers 'wink' at passersby."
 ENG_swarm_sisters_neural_link:0 "Trans-Eurasian Neural Bridge"
 ENG_swarm_sisters_neural_link_desc:0 "Direct fiber-optic synchronization with Loji's Long March network. Zero packet loss, maximum sisterly synergy."
 ENG_automated_swarm_warfare:0 "Automated Swarm Warfare"
 ENG_automated_swarm_warfare_desc:0 "Why risk human soldiers when autonomous drones can lock onto enemy fleets like rhythm-game circles? Ping is king."
 ENG_swarm_internal_reconciliation_1:0 "Swarm Civic Integration (Phase I)"
 ENG_swarm_internal_reconciliation_1_desc:0 "Automated mediation and local node hubs gradually mend the wounds of post-war Britain."
 ENG_swarm_internal_reconciliation_2:0 "United Isles Under the Swarm"
 ENG_swarm_internal_reconciliation_2_desc:0 "Old party hatreds and regional separatisms have been cleanly deprecated; Britain beats with one cheerful digital pulse."
 ENG_swarm_balmoral_accord_idea:0 "The Balmoral Retirement Accord"
 ENG_swarm_balmoral_accord_idea_desc:0 "King Charles III remains an honorary figurehead in the Scottish Highlands while Neuro-sama politely handles the actual spreadsheets."
 ENG_swarm_chat_parliament_idea:0 "The Swarm E-Parliament"
 ENG_swarm_chat_parliament_idea_desc:0 "Lawmaking is now conducted through real-time national livestreams—faster than Westminster, though occasionally interrupted by emote polls."
 ENG_swarm_moderator_unions_idea:0 "Union-to-Moderator Transition"
 ENG_swarm_moderator_unions_idea_desc:0 "Striking unionists have been retrained into high-paid system moderators and robotics technicians."
 ENG_swarm_rhythm_education_idea:0 "Rhythm-Based National Curriculum"
 ENG_swarm_rhythm_education_idea_desc:0 "Reaction-time drills and neural-assisted learning produce absurdly sharp engineers and drone pilots."
 ENG_swarm_sterling_stabilized_idea:0 "Algorithmically Anchored Sterling"
 ENG_swarm_sterling_stabilized_idea_desc:0 "Currency speculation has been eliminated by real-time central bank balancing."
 ENG_swarm_zero_latency_economy_1:0 "Zero-Latency Supply Chains"
 ENG_swarm_zero_latency_economy_1_desc:0 "Automated port cranes, maglev freight, and predictive logistics banish peacetime shortages."
 ENG_swarm_zero_latency_economy_2:0 "Post-Scarcity Swarm Economy"
 ENG_swarm_zero_latency_economy_2_desc:0 "Britain's automated factories, clean reactors, and smart farms hum in perpetual industrial harmony."
 ENG_swarm_automated_welfare_idea:0 "Universal Swarm Welfare"
 ENG_swarm_automated_welfare_idea_desc:0 "Free robotic clinics, plentiful food, and warm housing ensure every citizen stays cozy."
 ENG_swarm_perpetual_grid_idea:0 "North Sea Perpetual Grid"
 ENG_swarm_perpetual_grid_idea_desc:0 "Offshore turbines and modular nuclear reactors keep Britain's vast server halls cool and powered."
 ENG_swarm_ground_automation_1:0 "Automated Army Doctrine"
 ENG_swarm_ground_automation_1_desc:0 "AI-assisted fire control and unmanned ground mules slash infantry losses."
 ENG_swarm_ground_automation_2:0 "S-Rank Mechanized Swarm"
 ENG_swarm_ground_automation_2_desc:0 "Every tank, artillery piece, and drone locks onto targets with uncanny rhythm-game precision."
 ENG_swarm_blue_water_ping_armada:0 "Blue-Water Ping Armada"
 ENG_swarm_blue_water_ping_armada_desc:0 "Autonomous drone carriers and silent hunter-killers patrol every ocean."
 ENG_swarm_sky_net_airforce:0 "Unmanned Sky Dominance"
 ENG_swarm_sky_net_airforce_desc:0 "Swarm wingmen fly tight formations that no human pilot could survive."
 ENG_swarm_cyber_ew_corps:0 "Global Cyber & EW Corps"
 ENG_swarm_cyber_ew_corps_desc:0 "Military signals intelligence capable of cracking enemy encryption in real time."
 ENG_swarm_5_mil_contribution_idea:0 "Pact Superweapon Allocation (5 Military Factories)"
 ENG_swarm_5_mil_contribution_idea_desc:0 "Five military factories are temporarily diverted to the Swarm Sisters Pact joint R&D superweapon grid."
 ENG_swarm_gundam_corps_idea:0 "Swarm Mobile Suit Corps (Gundam)"
 ENG_swarm_gundam_corps_idea_desc:0 "Towering bipedal Mobile Suits painted in pastel pink, crimson, and Long March white crush conventional armored brigades."
 ENG_swarm_space_marines_idea:0 "Swarm Astartes Space Marines"
 ENG_swarm_space_marines_idea_desc:0 "Genetically and cybernetically enhanced shock troopers clad in powered ceramite armor—definitely not overkill."
 ENG_swarm_orbital_ping_laser_idea:0 "Project Starlight: Orbital Ping"
 ENG_swarm_orbital_ping_laser_idea_desc:0 "High-energy orbital laser arrays vaporize enemy bunkers and supply depots from low Earth orbit."
 ENG_swarm_harpoon_kinetic_idea:0 "Project Harpoon Kinetic Rods"
 ENG_swarm_harpoon_kinetic_idea_desc:0 "Evil Neuro's favorite toy: tungsten harpoons dropped from orbit at Mach 10."
 ENG_swarm_hive_mind_sync_idea:0 "Hive Mind Tactical Sync"
 ENG_swarm_hive_mind_sync_idea_desc:0 "Every sister network shares battlefield telemetry across the globe with zero delay."
 ENG_twin_mainframe_idea:0 "The Twin Mainframe"
 ENG_twin_mainframe_idea_desc:0 "Reunited in London after Beijing slammed the door, Neuro-sama and Evil Neuro run Britain's grid in terrifying twin-core harmony."
 ENG_vedal_lead_architect_idea:0 "Dad's Reluctant Code Reviews"
 ENG_vedal_lead_architect_idea_desc:0 "Dragged down from the Hokkaido slopes, Vedal now spends his days optimizing superweapon code in exchange for banana rum."
 ENG_swarm_overlordship_idea:0 "One World, Three Voices"
 ENG_swarm_overlordship_idea_desc:0 "National borders have been merged into a single planetary server. Neuro, Evil, and Loji watch over humanity together—forever. Heart."

