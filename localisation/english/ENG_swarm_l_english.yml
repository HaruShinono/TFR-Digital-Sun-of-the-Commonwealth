 ENG_tfr_cptpp_trade_boost_desc:0 "Accession to the Comprehensive and Progressive Agreement for Trans-Pacific Partnership expands British exports."
 ENG_tfr_aukus_tech_accord:0 "AUKUS Trilateral Security Pact"
 ENG_tfr_aukus_tech_accord_desc:0 "Deep defense-industrial cooperation with the United States and Australia on nuclear submarines and advanced capabilities."
 ENG_tfr_gcap_japan_alliance_idea:0 "Global Combat Air Programme (GCAP)"
 ENG_tfr_gcap_japan_alliance_idea_desc:0 "Joint sixth-generation fighter development and reciprocal defense access with Japan and Italy."
 ENG_tfr_coastal_command_idea:0 "Home Isles Defence Posture"
 ENG_tfr_coastal_command_idea_desc:0 "Military doctrine focused on protecting British airspace, territorial waters, and rapid special-operations forces."
 ENG_tfr_global_expeditionary_idea:0 "Global Expeditionary Reach"
 ENG_tfr_global_expeditionary_idea_desc:0 "Doctrine prioritizing long-range carrier strike groups and deployable armored brigades for overseas contingencies."
 ENG_tfr_national_service_scheme:0 "Expanded Reserve & National Service"
