 ENG_tfr_digital_whitehall_contracts_desc:0 "To modernize legacy government databases, the Cabinet Office outsourced automated routing software to private British contractors, including an independent developer registered under 'Vedal987'."
 ENG_tfr_crown_constitutional_anchor:0 "Constitutional Continuity"
 ENG_tfr_crown_constitutional_anchor_desc:0 "The Monarchy serves as an impartial pillar of national stability amidst severe parliamentary turbulence."
 ENG_tfr_crown_active_prerogative:0 "Expanded Royal Prerogative"
