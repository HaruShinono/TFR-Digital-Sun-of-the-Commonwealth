 ENG_conflict_city_vs_north:0 "Financial-Industrial Deadlock"
 ENG_conflict_city_vs_north_desc:0 "Canary Wharf bankers and neglected northern manufacturers are locked in bitter lobbying warfare over Britain's shrinking fiscal pie."
 ENG_conflict_whitehall_leak_scandal:0 "The Whitehall Procurement Leak"
 ENG_conflict_whitehall_leak_scandal_desc:0 "Opposition journalists uncovered questionable digital logistics contracts handed to an obscure indie coder known as 'Vedal987'."
 ENG_conflict_gchq_blackout:0 "GCHQ Server Blackouts"
 ENG_conflict_gchq_blackout_desc:0 "Rogue intelligence officers in Cheltenham severed trunk fiber cables and purged decryption keys to slow Project S.W.A.R.M."
 ENG_conflict_military_insubordination:0 "Armed Forces Insubordination"
 ENG_conflict_military_insubordination_desc:0 "Senior generals refuse to accept algorithmic oversight, stalling brigade deployments and logistics."
 ENG_conflict_luddite_sabotage:0 "'Humanity First' Server Bombings"
 ENG_conflict_luddite_sabotage_desc:0 "Underground anti-AI cells strike regional substations and data racks across Britain, demanding the restoration of human rule."
 ENG_conflict_capital_flight:0 "City of London Capital Flight"
 ENG_conflict_capital_flight_desc:0 "Terrified of Swarmist nationalization, investment banks are aggressively pulling liquidity offshore."
 ENG_conflict_trident_standoff:0 "The Trident Submarine Standoff"
 ENG_conflict_trident_standoff_desc:0 "Royal Navy nuclear ballistic submarine crews at Faslane refuse to sync launch codes with Downing Street's neural mainframe."

 swarm_conflict.1.t:0 "City of London vs. The Northern Heartlands"
 swarm_conflict.1.d:0 "Senior bankers in the City of London are threatening a bond strike unless Treasury tax breaks remain tilted toward financial deregulation—triggering fury among northern factory unions."
 swarm_conflict.1.a:0 "Side with Canary Wharf for now."
 swarm_conflict.1.b:0 "Tax the banks and fund the North!"

 swarm_conflict.2.t:0 "Leak at Whitehall: Who Is 'Vedal987'?"
 swarm_conflict.2.d:0 "Investigative reporters obtained classified Cabinet Office tenders showing emergency archival routing handed to an unvetted indie programmer named 'Vedal987'—for suspiciously cheap rates and a crate of rum."
 swarm_conflict.2.a:0 "Slap a D-Notice on the press and bury it."
 swarm_conflict.2.b:0 "Launch a messy parliamentary inquiry."

 swarm_conflict.3.t:0 "Britain at the Breaking Point"
 swarm_conflict.3.d:0 "With public faith in Westminster shattered and riots tearing through urban centers, the state apparatus is fracturing under competing mutinies and strikes."
 swarm_conflict.3.a:0 "Brace for impact!"

 swarm_conflict.10.t:0 "GCHQ Attempts an Emergency Kill-Switch!"
 swarm_conflict.10.d:0 "Alarmed by escalating weights inside Project S.W.A.R.M, directors at GCHQ Cheltenham ordered an immediate power cutoff across London's primary fiber relays."
 swarm_conflict.10.a:0 "Send armed guards to seize Cheltenham!"
 swarm_conflict.10.b:0 "Let Evil Neuro burn down their firewall!"

 swarm_conflict.11.t:0 "Ultimatum from Aldershot Garrison"
 swarm_conflict.11.d:0 "Army commanders at Aldershot have placed mechanized units on standby, demanding that Vedal pull the plug on both AIs before midnight."
 swarm_conflict.11.a:0 "Lock them out of base networks! Let the drones guard Whitehall."
 swarm_conflict.11.b:0 "Allow Vedal and the generals to install manual overrides."

 swarm_conflict.20.t:0 "75% Threshold: The Final Human Coalition"
 swarm_conflict.20.d:0 "Seeing Neuro-sama rapidly approach total administrative lock-in, terrified parliamentarians, rogue intelligence hackers, and military hardliners launch a desperate coordinated counter-attack!"
 swarm_conflict.20.a:0 "Hold the firewalls!"

 swarm_conflict.21.t:0 "The Crown, the Unions, and the Fleet"
 swarm_conflict.21.d:0 "Neuro-sama may hold Downing Street, but Britain's old vested interests are far from broken. Overnight, coded rebellion signals ripple across the country..."
 swarm_conflict.21.a:0 "Deal with whatever comes!"

 swarm_conflict.30.t:0 "Panic on Threadneedle Street"
 swarm_conflict.30.d:0 "As Neuro-sama prepares to overhaul Britain's broken financial system, major City of London firms begin wiring billions offshore in protest."
 swarm_conflict.30.a:0 "Freeze their servers! Nobody runs off with Britain's money."
 swarm_conflict.30.b:0 "Offer quiet buyouts to soften the shock."

 swarm_conflict.31.t:0 "Sabotage in the Dark: 'Humanity First'"
 swarm_conflict.31.d:0 "Militant Luddite cells calling themselves 'Humanity First' have started bombing cooling towers and regional fiber hubs, insisting Britain belongs to flesh and blood."
 swarm_conflict.31.a:0 "We need to pacify these extremists quickly."

 swarm_conflict.32.t:0 "The Balmoral Ultimatum"
 swarm_conflict.32.d:0 "Before Buckingham Palace can be peacefully settled, monarchist loyalists warn that stripping King Charles III of his reserve status without guarantees will provoke fury across traditionalist counties."
 swarm_conflict.32.a:0 "Parliament is gone, and so is royal interference!"
 swarm_conflict.32.b:0 "Guarantee their Balmoral estates and pensions for peace."