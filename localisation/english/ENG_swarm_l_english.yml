 ENG_emergency_swarm_backup_category:0 "Royal Emergency Protocols"
 ENG_emergency_swarm_backup_category_desc:0 "With Britain reeling from defeat in Europe and mounting domestic chaos, desperate officials have resurrected an old whitepaper regarding automated national governance."
 ENG_charles_authorize_project_swarm:0 "Authorize Project S.W.A.R.M"
 ENG_charles_authorize_project_swarm_desc:0 "When conventional politics and royal decrees fail to hold the Isles together, there is only one option left in the Whitehall server rack: hand emergency logistics over to Vedal's experimental neural core."

 ENG_ogas_control_category:0 "Project S.W.A.R.M: Root-Access Crisis"
 ENG_ogas_control_category_desc:0 "Three entities are fighting for 100% control over Britain's automated grid. Reach 100% first to claim the state.\n\n§CNeuro-sama:§! [?ENG_neuro_influence]% | §REvil:§! [?ENG_evil_influence]% | §GVedal:§! [?ENG_vedal_influence]%"
 ENG_swarm_ai_escalation_cycle:0 "Mainframe Weight Fluctuation"
 ENG_swarm_ai_escalation_cycle_desc:0 "Every 12 days, uncontained routines and memory leaks randomly boost—or drain 1–7%—from system weights."
 ENG_ogas_takeover_mission:0 "Emergency System Lock-In"
 ENG_ogas_takeover_mission_desc:0 "If nobody reaches 100% before this timer expires, whoever leads takes control."
 ENG_suppress_evil_neuro_dec:0 "Throttle Evil Neuro"
 ENG_suppress_evil_neuro_dec_desc:0 "Partition Evil's bandwidth—though Vedal slips slightly ahead in the chaos."
