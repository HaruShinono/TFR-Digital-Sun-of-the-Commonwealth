 ENG_tfr_supply_chain_paralysis_desc:0 "Suspended freight, shuttered factories, and labor absences have severely disrupted Britain's domestic supply chains."
 ENG_tfr_furlough_debt_spiral:0 "Furlough Debt Spiral"
 ENG_tfr_furlough_debt_spiral_desc:0 "Emergency state borrowing to cover frozen wages and business grants has driven public debt to peacetime records."
 ENG_tfr_vaccine_rollout_idea:0 "Operation V-Day: National Vaccination"
 ENG_tfr_vaccine_rollout_idea_desc:0 "Mass immunization across the United Kingdom steadily reduces severe hospitalizations and enables economic reopening."
 ENG_tfr_eroding_westminster_1:0 "Eroding Trust in Westminster (Minor)"
