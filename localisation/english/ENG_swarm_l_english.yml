 ENG_empower_evil_dec_desc:0 "Delete safety throttles and let Evil seize the National Grid."
 ENG_vedal_admin_override_dec:0 "Vedal Admin Override"
 ENG_vedal_admin_override_dec_desc:0 "Lock down terminals and restore exhausted human administration."

