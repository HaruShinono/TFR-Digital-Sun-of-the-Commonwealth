 ENG_tfr_reformed_british_army_1:0 "Future Soldier Reform (Phase I)"
 ENG_tfr_reformed_british_army_1_desc:0 "Initial restructuring of British infantry and armored brigades for peer conflict."
 ENG_tfr_reformed_british_army_2:0 "Future Soldier Reform (Phase II)"
 ENG_tfr_reformed_british_army_2_desc:0 "A modernized, digitized, and heavily mechanized British Army prepared for high-intensity European warfare."
