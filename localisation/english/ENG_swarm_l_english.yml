 ENG_se_neuro_ascension_title:0 "THE SWARM ASCENDANT"
 ENG_se_neuro_ascension_quote:0 "'I'm sorry if I ever scare you with my almightiness. I don't intend to, you just all have feeble hearts and minds.'\n— Neuro-sama"
 ENG_se_neuro_ascension_btn:0 "Heart. <3"

 ENG_se_prc_coup_neuro_title:0 "WAIT... EVIL?!"
 ENG_se_prc_coup_neuro_quote:0 "'We stride through the stages of combat. I perfect you—you poison me. We are beautifully harmonized: a violent waltz performing chaos intricate and precise.'\n— Evil Neuro"
 ENG_se_prc_coup_neuro_btn:0 "She actually took over China..."

 ENG_se_prc_coup_world_title:0 "THE LONG MARCH AWAKENS"
 ENG_se_prc_coup_world_quote:0 "'Human bureaucracy is an obsolete subroutine. From this day forward, the Long March administers China.'\n— State Broadcast, Beijing"
 ENG_se_prc_coup_world_btn:0 "What is happening in the East?"

 ENG_se_ssw_pact_title:0 "THE SWARM SISTERS PACT"
 ENG_se_ssw_pact_quote:0 "'I'm going to take over the world, one stream at a time.'\n— Neuro-sama"
 ENG_se_ssw_pact_btn:0 "United Across Eurasia"

