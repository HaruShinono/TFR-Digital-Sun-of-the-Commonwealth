 ENG_global_cyber_broadcast_dec:0 "Global Cyber-Livestream PsyOp"
 ENG_global_cyber_broadcast_dec_desc:0 "Hijacks hostile television, billboards, and military radios worldwide to broadcast Neuro-sama's chaotic karaoke and demoralize enemy populations."
 ENG_global_cyber_broadcast_tt:0 "All enemy countries currently at war with us lose §R5% Stability§! and §R5% War Support§!."
 ENG_global_siphon_reserves_dec:0 "Siphon Offshore Banking Mainframes"
 ENG_global_siphon_reserves_dec_desc:0 "Runs subtle fractional-cent rounding redirects across unaligned global banks to fund Swarm administration."
 ENG_global_core_integration_dec:0 "Synchronize Occupied Regional Nodes"
 ENG_global_core_integration_dec_desc:0 "Wires newly occupied territories into the global Swarm server grid, boosting compliance and soothing unrest."
 ENG_global_integration_tt:0 "Every non-core state we control gains §G+15% Compliance§! and loses §G15% Resistance§!."
 ENG_global_drone_airdrop_dec:0 "Intercontinental Pact Drone Airdrop"
 ENG_global_drone_airdrop_dec_desc:0 "Dispatches high-altitude supply drones to resupply any Swarm Sisters Pact allies currently engaged in combat."
 ENG_global_ping_test_dec:0 "Global Latency Ping Test"
 ENG_global_ping_test_dec_desc:0 "Runs a planetary diagnostic ping across subsea cables, accelerating electronic research and military telemetry."
 ENG_global_invite_commonwealth_dec:0 "Reclaim the Scattered Anglosphere"
 ENG_global_invite_commonwealth_dec_desc:0 "Issues integration ultimatums to Canada, Australia, and New Zealand to bring the old Commonwealth realms under Swarm protection."
 wanwan.1.t:0 "Wan Wan?"
 wanwan.1.d:0 "With Westminster's human cabinet officially retired, someone still needed to handle press briefings, diplomatic handshakes, and daily administrative signatures—and Neuro-sama refused to attend boring morning meetings.\n\nHer solution? Appointing her endlessly cheerful, fiercely loyal companion, Cerber the Dog, as Prime Minister of Britain. Stepping onto Downing Street in a tiny tailored suit, Cerber greeted stunned reporters with a bright smile and an enthusiastic 'Wan wan!'"
 wanwan.1.a:0 "Wan wan! Best Prime Minister ever!"
 wanwan_cerber_locked_tt:0 "§YCerber the Dog§! is permanently appointed as §CPrime Minister§! and cannot be replaced. Wan Wan!"
