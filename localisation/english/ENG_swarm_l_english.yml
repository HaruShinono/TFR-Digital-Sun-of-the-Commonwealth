 ENG_distract_vedal_dec_desc:0 "Send fake compiler errors and banana rum to his bunker—giving Evil brief room to move."
 ENG_expand_neuro_nodes_dec:0 "Prioritize Neuro-sama"
 ENG_expand_neuro_nodes_dec_desc:0 "Route national servers to Neuro's core, provoking rival subroutines to push back slightly."
